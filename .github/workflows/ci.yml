name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        java: [17, 21]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./scripts/demo.sh
      - name: Verify offline Resolver fixture
        run: |
          REPORT=target/it/offline-resolver/target/supply-chain-verification.ndjson
          test -s "$REPORT"
          grep -q '"gav":"org.example:fixture:1.0".*"check":"public-sbom".*"status":"PASS"' "$REPORT"
          grep -q '"gav":"org.example:fixture:1.0".*"check":"openssf-scorecard".*"status":"UNKNOWN"' "$REPORT"
          grep -q 'OpenSSF Scorecard lookup skipped because Maven is offline' "$REPORT"
      - name: Verify live demo evidence shape
        run: |
          REPORT=demo/target/supply-chain-verification.ndjson
          test -s "$REPORT"
          grep -q '"schemaVersion":1' "$REPORT"
          grep -q '"gav":"org.apache.commons:commons-lang3:3.17.0".*"check":"public-sbom".*"status":"PASS"' "$REPORT"
          grep -q '"repositoryId":"central"' "$REPORT"
          grep -q 'maven:central:sha256:' "$REPORT"
          grep -q '"check":"openssf-scorecard"' "$REPORT"
