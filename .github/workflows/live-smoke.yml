name: live-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  maven-central-and-scorecard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run live evidence demo
        run: ./scripts/demo.sh
      - name: Verify expected live observations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          rows = [json.loads(line) for line in Path(
              "demo/target/supply-chain-verification.ndjson"
          ).read_text().splitlines() if line.strip()]

          sbom = next(
              row for row in rows
              if row["component"]["gav"] == "org.apache.commons:commons-lang3:3.17.0"
              and row["check"] == "public-sbom-sidecar"
          )
          assert sbom["status"] == "PASS", sbom
          assert sbom["component"]["artifactRepositoryId"] == "central", sbom
          assert sbom["component"]["sha256"], sbom
          assert sbom["attributes"]["contentValidated"] == "false", sbom
          assert any("commons-lang3-3.17.0-cyclonedx.json" in x for x in sbom["locations"])

          scorecard = next(
              row for row in rows
              if row["component"]["gav"] == "org.apache.commons:commons-lang3:3.17.0"
              and row["check"] == "openssf-scorecard-current"
          )
          assert scorecard["status"] == "PASS", scorecard
          assert scorecard["attributes"]["project"] == "github.com/apache/commons-lang", scorecard
          assert scorecard["attributes"]["artifactVersionBound"] == "false", scorecard
          assert scorecard["attributes"].get("commit"), scorecard
          PY
